name: 'bump-by-label'
description: 'Bumps the version of a project based on the labels applied to a merged pull request.'
inputs:
  github_token:
    description: 'GitHub token to authenticate with the GitHub API'
    required: true
  command:
    description: 'Command that bumps the version, run by bash. The bump type (major, minor or patch) replaces `{bump}`, or is appended when there is no `{bump}`. E.g. `uv version --no-sync --bump`. `semver-bump.sh` from this action is on PATH.'
    required: true
  validate:
    description: 'Command that prints the current version, run by bash. E.g. `uv version --short`. The first MAJOR.MINOR.PATCH in its output is used.'
    required: true
  base_branch:
    description: 'The default branch to rebase and open the bump PR against.'
    required: false
    default: 'main'
  branch-prefix:
    description: 'Prefix of the bump branch, `<prefix>/bump-version-from-<old>-to-<new>`. Empty for no prefix.'
    required: false
    default: 'workflow'
  create-tag:
    description: 'Tag the merge commit `<tag-prefix><new>` when a bump PR merges. Set to `false` when another workflow tags releases.'
    required: false
    default: 'true'
  tag-prefix:
    description: 'Prefix of release tags.'
    required: false
    default: 'v'
  moving-tags:
    description: 'Also move `<tag-prefix><major>` and `<tag-prefix><major>.<minor>` to the release (force-pushes those tags).'
    required: false
    default: 'false'
  commit-user-name:
    description: 'Git author and committer name for the bump commit. Change it when pushing with an app token or PAT.'
    required: false
    default: 'github-actions[bot]'
  commit-user-email:
    description: 'Git author and committer email for the bump commit.'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'

outputs:
  version-bumped:
    description: '`true` when a bump commit was made, else `false`.'
    value: ${{ steps.bump.outputs.version-bumped }}
  previous-version:
    description: 'Version before the bump, from `validate`. Empty when it was not read.'
    value: ${{ steps.bump.outputs.previous-version }}
  new-version:
    description: 'Version after the bump; empty when nothing was bumped.'
    value: ${{ steps.bump.outputs.new-version }}
  bump-type:
    description: '`major`, `minor`, `patch` or `none`.'
    value: ${{ steps.bump.outputs.bump-type }}
  pr-number:
    description: 'Number of the bump PR; empty when there is none.'
    value: ${{ steps.bump.outputs.pr-number }}
  tag:
    description: 'Tag created when a bump PR merged; empty if none.'
    value: ${{ steps.bump.outputs.tag }}

runs:
  using: 'composite'
  steps:
    - name: Run bump-by-label
      id: bump
      shell: bash
      # Inputs go through env, not the command line, so their quotes reach
      # entrypoint.sh intact and can't break out of the run script.
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_VALIDATE: ${{ inputs.validate }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        INPUT_CREATE_TAG: ${{ inputs.create-tag }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_MOVING_TAGS: ${{ inputs.moving-tags }}
        INPUT_COMMIT_USER_NAME: ${{ inputs.commit-user-name }}
        INPUT_COMMIT_USER_EMAIL: ${{ inputs.commit-user-email }}
      run: bash "${{ github.action_path }}/entrypoint.sh"
