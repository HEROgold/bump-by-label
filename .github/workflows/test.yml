name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files -z '*.sh' '*.bash' | xargs -0 shellcheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          git clone -q --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
      - run: bats tests/*.bats

  ecosystems:
    name: ecosystem (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - python-uv
          - python-poetry
          - python-hatch
          - javascript
          - typescript
          - rust
          - rust-workspace
          - go
          - csharp
          - cmake
          - meson
          - php
          - ruby
          - maven
          - gradle
          - elixir
          - dart
    env:
      # A missing tool fails the job instead of skipping the tests.
      REQUIRE_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          git clone -q --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      - if: startsWith(matrix.suite, 'python-') || matrix.suite == 'meson'
        uses: astral-sh/setup-uv@v6
      - if: matrix.suite == 'python-poetry'
        run: uv tool install poetry
      - if: matrix.suite == 'python-hatch'
        run: uv tool install hatch
      - if: matrix.suite == 'meson'
        run: uv tool install meson

      - if: matrix.suite == 'javascript' || matrix.suite == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - if: startsWith(matrix.suite, 'rust')
        uses: dtolnay/rust-toolchain@stable
      - if: startsWith(matrix.suite, 'rust')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - if: matrix.suite == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - if: matrix.suite == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - if: matrix.suite == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - if: matrix.suite == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - if: matrix.suite == 'maven' || matrix.suite == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.suite == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - if: matrix.suite == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - if: matrix.suite == 'dart'
        uses: dart-lang/setup-dart@v1

      - run: bats tests/ecosystems/${{ matrix.suite }}.bats

  e2e:
    name: end-to-end (uses ./)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: action

      # The workspace root becomes the project being bumped. Its origin is a
      # local bare repo and `gh` is a stub, so nothing reaches GitHub.
      - name: Set up a fixture project
        run: |
          cp -R action/tests/fixtures/javascript/. .
          git init -q -b main .
          echo '/action/' >> .git/info/exclude
          git add -A
          git -c user.name=dev -c user.email=dev@example.com commit -q -m initial
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q -u origin main

          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "$*" >> "$RUNNER_TEMP/gh.log"
          if [ "$1 $2" = "pr view" ]; then exit 1; fi
          if [ "$1 $2" = "pr create" ]; then echo "https://github.com/owner/repo/pull/7"; fi
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          # A merged PR labelled Minor. The runner resets GITHUB_EVENT_PATH for
          # every step, so it's passed as BUMP_BY_LABEL_EVENT_PATH.
          jq -n '{pull_request: {number: 42, merged: true, head: {ref: "feature"},
            base: {ref: "main"}, labels: [{name: "Minor"}]}}' > "$RUNNER_TEMP/event.json"

      - name: Run the action
        uses: ./action
        env:
          BUMP_BY_LABEL_EVENT_PATH: ${{ runner.temp }}/event.json
        with:
          github_token: unused
          command: npm version --no-git-tag-version
          validate: node -p "require('./package.json').version"

      - name: Check the bump
        run: |
          set -x
          version=$(git --git-dir="$RUNNER_TEMP/origin.git" show workflow/bump-version-from-1.2.3-to-1.3.0:package.json | jq -r .version)
          test "$version" = "1.3.0"
          grep -q '^pr create' "$RUNNER_TEMP/gh.log"
